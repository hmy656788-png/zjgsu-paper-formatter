name: Test and deploy to Render

# PR 与 main 推送先运行完整回归；只有验证通过的 main 才触发 Render Deploy Hook，
# 并等待同一 commit 真正通过健康检查后才把部署标记为成功。
# 背景：本服务是按「公开仓库 URL」创建的，Render 拿不到 GitHub webhook，
# 自动部署不生效；push 触发的 GitHub Actions 是即时可靠的（不同于会被降频的 schedule），
# 用它调用 Deploy Hook 实现真正的「push = 自动上线」。
# Hook 存放在仓库加密 Secret RENDER_DEPLOY_HOOK 中（如需轮换，去 Render 控制台
# Settings → Deploy Hook 重新生成，并用 `gh secret set RENDER_DEPLOY_HOOK` 更新）。
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: render-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-ci.txt

      - name: Install dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r requirements.txt"

      - name: Install CI dependencies
        run: "python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.txt"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Run regression suite
        run: |
          python -m coverage run --branch --source=app,format_paper,docx_validation -m unittest discover -s tests -q
          python -m coverage report --fail-under=80 --skip-covered

      - name: Check source syntax
        run: |
          node --check static/script.js
          node --check keepwarm-worker/index.js
          python -m compileall -q app.py docx_validation.py gunicorn_config.py format_paper.py tests

      - name: Validate runtime descriptors
        run: |
          python -m json.tool vercel.json > /dev/null
          gunicorn --check-config --config gunicorn_config.py app:app

  deploy:
    if: >-
      github.repository == 'hmy656788-png/zjgsu-paper-formatter' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      RENDER_HEALTH_URL: https://zjgsu-paper-formatter.onrender.com/api/health
    steps:
      - name: Trigger Render deploy
        run: |
          set -euo pipefail
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK is not configured"
            exit 1
          fi
          deploy_separator="?"
          case "$RENDER_DEPLOY_HOOK" in
            *\?*) deploy_separator="&" ;;
          esac
          deploy_response="$(mktemp)"
          trap 'rm -f "$deploy_response"' EXIT
          deploy_status="$(
            curl --fail-with-body --show-error --silent --max-time 30 \
              --output "$deploy_response" --write-out "%{http_code}" \
              "${RENDER_DEPLOY_HOOK}${deploy_separator}ref=${GITHUB_SHA}"
          )"
          case "$deploy_status" in
            200)
              if deploy_id="$(jq -er '.deploy.id | select(type == "string" and test("^dep-[a-z0-9]+$"))' "$deploy_response" 2>/dev/null)"; then
                echo "verified commit ${GITHUB_SHA} started as Render deploy ${deploy_id}"
              else
                echo "::error::Render returned 200 without a deploy ID"
                exit 1
              fi
              ;;
            202)
              echo "verified commit ${GITHUB_SHA} queued behind an in-progress Render deploy"
              ;;
            *)
              echo "::error::Unexpected Render Deploy Hook status: ${deploy_status}"
              exit 1
              ;;
          esac

      - name: Wait for verified commit to become live
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            if health_body="$(
              curl --fail --show-error --silent \
                --connect-timeout 10 --max-time 20 \
                "$RENDER_HEALTH_URL"
            )"; then
              if deployed_commit="$(
                jq -er '
                  select(
                    .success == true and
                    .status == "ok" and
                    .storage.storage_ready == true
                  ) |
                  .deployment.commit |
                  select(type == "string" and test("^[0-9a-f]{40}$"))
                ' \
                  <<<"$health_body" 2>/dev/null
              )"; then
                if [ "$deployed_commit" = "$GITHUB_SHA" ]; then
                  echo "Render is live and healthy at verified commit ${GITHUB_SHA}"
                  exit 0
                fi
                echo "waiting for ${GITHUB_SHA}; Render currently serves ${deployed_commit:-unknown}"
              else
                echo "waiting for ${GITHUB_SHA}; health response has no deployment identity yet"
              fi
            else
              echo "waiting for ${GITHUB_SHA}; health endpoint is not ready"
            fi
            sleep 15
          done
          echo "::error::Render did not publish healthy commit ${GITHUB_SHA} within 30 minutes"
          exit 1
