name: Keep Render warm

# Render 免费档闲置约 15 分钟会休眠，下次访问要冷启动 ~30-60s。
# 这里每 5 分钟 ping 一次 /api/health 让它保持唤醒，从而没有冷启动。
# 注意：GitHub 计划任务可能有几分钟延迟，且仓库 60 天无提交会被自动停用；
# 想更稳可再叠加一个 UptimeRobot/cron-job.org 监控（见 DEPLOY.md）。
on:
  schedule:
    - cron: "*/5 * * * *"   # 每 5 分钟（GitHub 计划任务最小间隔）
  workflow_dispatch: {}      # 支持手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: curl -fsS -m 30 https://zjgsu-paper-formatter.onrender.com/api/health || true
